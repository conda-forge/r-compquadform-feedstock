{% set version = "1.4.4" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-compquadform
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/CompQuadForm_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/CompQuadForm/CompQuadForm_{{ version }}.tar.gz
  sha256: 84af2087bf7cd6dfb7aa9468fd88939267559f46c0dc7bea9d010314f42fa143

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ compiler('c') }}              # [not win]
    - {{ stdlib("c") }}                # [not win]
    - {{ compiler('m2w64_c') }}        # [win]
    - {{ stdlib("m2w64_c") }}          # [win]
    - {{ compiler('cxx') }}            # [not win]
    - {{ compiler('m2w64_cxx') }}      # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}make
    - {{ posix }}sed               # [win]
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('CompQuadForm')"           # [not win]
    - "\"%R%\" -e \"library('CompQuadForm')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=CompQuadForm
  license: GPL-2.0-or-later
  summary: Computes the distribution function of quadratic forms in normal variables using Imhof's method, Davies's algorithm, Farebrother's algorithm or Liu et al.'s algorithm.
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
